<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo</title>
        <style>
        .seleccionado{
            border-color: rgb(0, 157, 255);
        }
    </style>
</head>
<body>

    <input type="text" id="txtnombre" placeholder="Escribe tu nombre" 
    onclick="cambiaestilo()">
    <input type="button" value="Submit" 
    onclick="alerta()">

    <input type="number" name="NumeroA" id="txtNumeroA">
    <input type="button" value="Sumar" onclick="sumar()">
    <input type="number" name="NumeroB" id="txtNumeroB">
    <input type="number" id="txtResultado">

    <script>
        function sumar(){
            var a;
            a=document.getElementById("txtNumeroA");
            alert(a);
        }
        function alerta() {
            alert(document.getElementById("txtnombre").value);
        }
        function cambiaestilo() {
            document.getElementById("txtnombre").className = " seleccionado";
        }
    </script>

</body>
</html>
